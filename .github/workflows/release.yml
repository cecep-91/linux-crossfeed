name: Release

# Tag a commit `vX.Y.Z` and push it to cut a release:
#   git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpipewire-0.3-dev libpulse-dev libasound2-dev libgtk-3-dev libayatana-appindicator3-dev rpm dpkg-dev

      - name: Build crossfeed application
        run: make -j$(nproc)

      - name: Build Debian and RPM packages
        run: |
          make deb
          make rpm

      - name: Assemble release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pipewire-crossfeed-$VERSION-linux-x86_64"
          mkdir -p "$PKG/bin" "$PKG/data" "$PKG/scripts"
          cp bin/crossfeed "$PKG/bin/"
          cp data/* "$PKG/data/"
          cp scripts/* "$PKG/scripts/" 2>/dev/null || true
          cp install.sh Makefile README.md LICENSE "$PKG/"
          tar czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb-rpm-tar
          path: dist/*

  build-xbps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package XBPS in Void Linux container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/void-linux/void-glibc:latest sh -c "
            xbps-install -Suy -y bash base-devel pipewire-devel pulseaudio-devel alsa-lib-devel gtk+3-devel libayatana-appindicator-devel &&
            make clean &&
            make -j\$(nproc) &&
            make xbps
          "

      - uses: actions/upload-artifact@v4
        with:
          name: package-xbps
          path: dist/*.xbps

  release:
    needs: [build-packages, build-xbps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            *.xbps
            *.tar.gz
          generate_release_notes: true
          body: |
            ### Standalone Crossfeed Release

            High-performance headphone crossfeed audio processor with native GTK3 GUI, system tray, and universal sound server support (PipeWire, PulseAudio, ALSA).

            #### Packages Included:
            - **`.deb`**: Debian, Ubuntu, Linux Mint, Pop!_OS
            - **`.rpm`**: Fedora, RHEL, openSUSE
            - **`.xbps`**: Void Linux
            - **`.tar.gz`**: Standalone binary and assets for any Linux distribution
