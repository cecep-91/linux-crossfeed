name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/package.sh scripts/update.sh

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpipewire-0.3-dev libpulse-dev libasound2-dev libgtk-3-dev libayatana-appindicator3-dev rpm dpkg-dev xvfb
      - name: Build crossfeed application
        run: make -j$(nproc)
      - name: Run DSP, IPC, and shutdown regression tests
        run: make test test-rt test-routing test-cli
      - name: Check GTK controls and graph in light and dark themes
        run: |
          GTK_THEME=Adwaita xvfb-run -a make test-gui
          GTK_THEME=Adwaita:dark xvfb-run -a make test-gui
      - name: Run address and undefined-behavior checks
        run: make test-sanitize
      - name: Run thread race checks
        run: make test-tsan
      - name: Run DSP throughput benchmark
        run: make bench
      - name: Build Debian (.deb) and RPM (.rpm) packages
        run: |
          make deb
          make rpm
          ls -la dist/
      - name: Test installation script
        run: |
          ./install.sh
          ~/.local/bin/crossfeed --version
          ./install.sh --uninstall
      - name: Test Debian (.deb) package installation
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/crossfeed --version
          /usr/bin/crossfeed bench
          sudo apt-get remove -y crossfeed
      - name: Test RPM (.rpm) package in Fedora container
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:latest sh -c "
            dnf install -y ./dist/*.rpm &&
            crossfeed --version &&
            crossfeed bench
          "

  build-void:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package XBPS in Void Linux container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/void-linux/void-glibc:latest sh -c "
            xbps-install -Suy -y bash base-devel pipewire-devel pulseaudio-devel alsa-lib-devel gtk+3-devel libayatana-appindicator-devel &&
            make clean &&
            make -j\$(nproc) &&
            make xbps &&
            xbps-rindex -f -a dist/*.xbps &&
            xbps-install -Suy -y -R dist crossfeed &&
            /usr/bin/crossfeed --version &&
            /usr/bin/crossfeed bench
          "
          ls -la dist/
